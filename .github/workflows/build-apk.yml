name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Configure Android Project
        run: |
          if [ -d "apna_shehr_app" ] && [ -f "apna_shehr_app/pubspec.yaml" ]; then
            cp -r apna_shehr_app/* . || true
          fi

          mkdir -p /tmp/backup
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/backup/AndroidManifest.xml
          fi

          rm -rf android

          flutter create . --project-name apna_shehr_app --platforms android --org com.apnashehronline

          if [ -f "/tmp/backup/AndroidManifest.xml" ]; then
            cp /tmp/backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi

          # Fix app_links & compileSdkVersion issue
          cat << 'EOF' >> android/build.gradle

allprojects {
    ext.compileSdkVersion = 34
    ext.targetSdkVersion = 34
    ext.minSdkVersion = 21
}

subprojects {
    project.evaluationDependsOn(":app")
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                compileSdkVersion 34
            }
        }
    }
}
EOF

          # Configure app build.gradle
          sed -i 's/minSdk = .*/minSdk = 21/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/compileSdk = .*/compileSdk = 34/g' android/app/build.gradle || true
          sed -i 's/compileSdkVersion .*/compileSdkVersion 34/g' android/app/build.gradle || true
          sed -i 's/signingConfig = signingConfigs.release/signingConfig = signingConfigs.debug/g' android/app/build.gradle || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apna-shehr-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
