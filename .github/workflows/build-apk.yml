name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Configure Android Project
        run: |
          if [ -d "apna_shehr_app" ] && [ -f "apna_shehr_app/pubspec.yaml" ]; then
            cp -r apna_shehr_app/* . || true
          fi

          mkdir -p /tmp/backup
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/backup/AndroidManifest.xml
          fi

          rm -rf android

          flutter create . --project-name apna_shehr_app --platforms android --org com.apnashehronline

          if [ -f "/tmp/backup/AndroidManifest.xml" ]; then
            cp /tmp/backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi

          find android -name "build.gradle*" -exec sed -i 's/minSdk = .*/minSdk = 21/g' {} + || true
          find android -name "build.gradle*" -exec sed -i 's/minSdkVersion .*/minSdkVersion 21/g' {} + || true
          find android -name "build.gradle*" -exec sed -i 's/signingConfig = signingConfigs.release/signingConfig = signingConfigs.debug/g' {} + || true

      - name: Optimize Supabase dependency
        run: |
          python3 -c "
          import os

          if os.path.exists('pubspec.yaml'):
              with open('pubspec.yaml', 'r') as f: text = f.read()
              text = text.replace('supabase_flutter: ^2.8.0', 'supabase: ^2.6.0')
              with open('pubspec.yaml', 'w') as f: f.write(text)

          srv_path = 'lib/core/services/supabase_service.dart'
          if os.path.exists(srv_path):
              with open(srv_path, 'r') as f: text = f.read()
              text = text.replace('package:supabase_flutter/supabase_flutter.dart', 'package:supabase/supabase.dart')
              text = text.replace('SupabaseClient? get client => _initialized ? Supabase.instance.client : null;', 'SupabaseClient? _client;\n  SupabaseClient? get client => _client;')
              text = text.replace('await Supabase.initialize(\n        url: SupabaseConfig.url,\n        anonKey: SupabaseConfig.anonKey,\n      );', '_client = SupabaseClient(SupabaseConfig.url, SupabaseConfig.anonKey);')
              with open(srv_path, 'w') as f: f.write(text)
          "
          flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apna-shehr-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
